[project]
name = "backend"
version = "0.1.0"
description = "ASE Group 3 backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "email-validator>=2.2,<3.0",
    "mysql-connector-python>=9.0,<10.0",
    "ultralytics>=8.4,<9.0",
    "python-multipart>=0.0.32",
    # The sign reader imports fraction-solver's `la` package, which needs SciPy.
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
# CPU-only PyTorch for CI and machines without a GPU: `uv sync --extra cpu`.
# Without it, Linux installs PyPI's torch, which bundles CUDA (several GB) and
# is what GPU training needs. `gpu` selects that default build; it exists so the
# two can be declared as conflicting, which lets uv lock both variants.
cpu = ["torch", "torchvision"]
gpu = ["torch", "torchvision"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
