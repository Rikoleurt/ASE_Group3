services:
  mysql:
    image: mysql:8.4
    container_name: ase-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ase
      MYSQL_USER: ase
      MYSQL_PASSWORD: ase
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ase_mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  ase_mysql_data:
