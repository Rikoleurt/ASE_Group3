[project]
name = "fraction-solver"
version = "0.1.0"
description = "Linear A fraction solver (research tool)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.13",
    "sympy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    # The dataset tests read the YOLO data.yaml files that `la` writes.
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
