[pytest]
testpaths = backend/tests fraction-solver/tests
pythonpath = . fraction-solver
# Unknown markers and config keys are errors, not typos that silently do nothing.
addopts = --strict-markers --strict-config
# A known-bug test (xfail) that starts passing fails the run, so its marker is
# removed in the PR that fixes the bug. See CONTRIBUTING.md.
xfail_strict = true
markers =
    mysql: integration tests requiring a running MySQL instance (RUN_MYSQL_TESTS=1)
